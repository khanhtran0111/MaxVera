name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  phase-0-1-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install pinned uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.11.32"
          enable-cache: false
      - name: Synchronize locked Python 3.10 environment
        run: uv sync --frozen --group dev --python 3.10.16
      - name: Unit tests
        run: uv run --frozen pytest
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Type check
        run: uv run --frozen mypy src
      - name: Shell syntax
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Secret-safe CI preflight
        run: bash scripts/tools/preflight.sh --profile ci
