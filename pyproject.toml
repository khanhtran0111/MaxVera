[project]
name = "maxvera"
version = "2.0.0"
description = "Reproducible graph-grounded zero-hint vulnerability research pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "pandas>=2.2,<3",
  "pyyaml>=6.0.2,<7",
  "requests>=2.32,<3",
  "tqdm>=4.67,<5",
]

[project.scripts]
maxvera = "maxvera.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
  "types-pyyaml>=6.0.12,<7",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maxvera", "src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["third_party", "data", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
exclude = ["^third_party/"]
