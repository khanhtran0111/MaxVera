schema:
  version: phase9-useg-v1
  layers: [evidence, program, security]
  evidence_node_kinds:
    - HYPOTHESIS
    - ASSERTION
    - CODEQL_FINDING
    - TAINT_PATH
    - SANITIZER_EVIDENCE
    - CONTRADICTION
    - VERIFICATION_RESULT
  reference_node_kinds: [PROGRAM_NODE, SECURITY_NODE]
  edge_kinds: [SUPPORTS, CONTRADICTS, VERIFIED_BY, DERIVED_FROM, MATCHES]
  confidence_representation: independent_components_no_aggregate
  canonical_serialization: sorted_jsonl_utf8

mapping:
  version: phase9-cross-layer-mapping-v1
  program_location_rule: same_file_line_containment
  prefer_exact_symbol: true
  max_program_matches_per_assertion: 3
  security_cwe_rule: exact_candidate_cwe_identity
  security_api_rule: exact_symbol_to_callable_or_type_with_cwe_role
  max_security_api_matches_per_assertion: 8
  max_precondition_matches_per_assertion: 8
  taint_candidate_rule: incident_to_location_matched_program_node
  max_taint_candidates_per_hypothesis: 16
  materialize_unverified_candidates: true
  synthesize_missing_evidence: false

coverage:
  expected_full_projects: 96
  expected_phase7_successes: 81
  expected_phase7_failures: 15
  failures_count_as_miss: true

validation:
  require_provenance_for_every_node_and_edge: true
  require_independent_confidence_components: true
  require_acyclic_evidence_dependencies: true
  require_roundtrip_lossless: true
  require_candidate_path_program_and_security_trace: true
  require_final_finding_full_trace: true
  allow_zero_final_findings_before_phase_11: true
  forbidden_output_substrings:
    - CVE-
    - ground_truth_cwe
    - advisory_text
    - patch_commit
    - fix_commit
    - fixed_method
    - fixed_line
    - vulnerable_description
    - test_locked

execution:
  network_calls: 0
  llm_calls: 0
  project_workers: 1
  atomic_finalization: true
  full_result_overwrite: false
