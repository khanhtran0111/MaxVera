  fixed_root: data/interim/phase11_fixed_codeql_databases
  fixed_database_contract: opaque_project_id_at_development_fix_revision

verification:
  version: phase11-static-verification-v1
  flow_engine: codeql_java_global_taint_tracking
  max_iterations: 1
  max_paths_per_specification: 4
  max_query_invocations_per_project: 40
  evidence_threshold: vulnerable_path_absent_in_fixed_database
  stop_order: [EVIDENCE_THRESHOLD_MET, BUDGET_EXHAUSTED, NO_NEW_EVIDENCE]
  unresolved_endpoint_status: UNVERIFIED
  no_path_status: UNVERIFIED
  fixed_path_persists_status: UNVERIFIED
  llm_verdict_allowed: false
  llm_calls: 0
  llm_tokens: 0

useg_update:
  analysis_iteration: 1
  materialize_node_kinds: [VERIFICATION_RESULT, TAINT_PATH]
  materialize_edge_kinds: [SUPPORTS, CONTRADICTS, VERIFIED_BY]
  preserve_phase9_graph: true

execution:
  codeql_cli_version: "2.26.2"
  query_pack: codeql/java-all@9.2.2
  threads: 2
  ram_mb: 8192
  timeout_seconds_per_query: 600
  project_workers: 1
  atomic_finalization: true
  full_result_overwrite: false

validation:
  require_exact_phase9_and_phase10_locks: true
  require_final_status_per_specification: true
  require_path_or_explicit_unverified: true
  require_differential_for_verified: true
  require_deterministic_stop_reason: true
  require_zero_llm_calls: true
