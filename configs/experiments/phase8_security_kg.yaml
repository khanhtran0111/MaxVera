scope:
  graph_scope: global
  project_views_deferred_to_phase: 9
  language: Java
  root_cwes: [CWE-22, CWE-78, CWE-79, CWE-94]
  related_cwe_view_id: "1000"
  related_cwe_max_hops: 1
  include_relation_when_incident_to_root: true
  ingest_project_advisories: false
  ingest_evaluator_only: false

schema:
  version: phase8-security-kg-v1
  node_kinds:
    - CWE
    - OWASP_CATEGORY
    - SOURCE
    - SINK
    - SANITIZER
    - PROPAGATOR
    - PRECONDITION
    - MITIGATION
  edge_kinds:
    - RELATED_CWE
    - MAPS_TO_OWASP
    - HAS_SOURCE
    - HAS_SINK
    - HAS_SANITIZER
    - HAS_PROPAGATOR
    - HAS_PRECONDITION
    - MITIGATED_BY
  deterministic_layer: deterministic
  inferred_layer: llm_inferred
  canonical_serialization: sorted_jsonl_utf8

api_semantics:
  include_experimental_models: false
  allowed_model_provenance: [manual, df-manual, ai-manual, hq-manual]
  propagator_scope: same_model_file_as_relevant_semantic
  source_kind_to_cwes:
    remote: [CWE-22, CWE-78, CWE-79, CWE-94]
    file: [CWE-22, CWE-94]
    uri-path: [CWE-22]
    environment: [CWE-78]
    commandargs: [CWE-78]
  sink_kind_to_cwe:
    path-injection: CWE-22
    command-injection: CWE-78
    html-injection: CWE-79
    js-injection: CWE-79
    groovy-injection: CWE-94
    jexl-injection: CWE-94
    mvel-injection: CWE-94
    ognl-injection: CWE-94
    template-injection: CWE-94
    xslt-injection: CWE-94
  sanitizer_kind_to_cwes:
    html-injection: [CWE-79]
    js-injection: [CWE-79]

confidence:
  authoritative_catalog: 1.0
  authoritative_mapping: 1.0
  codeql_model_provenance:
    manual: 1.0
    df-manual: 1.0
    ai-manual: 0.9
    hq-manual: 1.0
    hq-generated: 0.85
  unknown_codeql_model: 0.75
  llm_inferred_maximum: 0.7

validation:
  require_provenance_for_every_fact: true
  required_root_relations:
    - RELATED_CWE
    - MAPS_TO_OWASP
    - HAS_SOURCE
    - HAS_SINK
    - HAS_PROPAGATOR
    - HAS_PRECONDITION
    - MITIGATED_BY
  required_global_node_kinds:
    - CWE
    - OWASP_CATEGORY
    - SOURCE
    - SINK
    - SANITIZER
    - PROPAGATOR
    - PRECONDITION
    - MITIGATION
  forbidden_fact_substrings: [CVE-, proj_, advisory_text, patch_commit, fix_commit, test_locked]
  require_empty_inferred_layer: true
  audit_sample_per_root_cwe: true

execution:
  network_during_build: false
  llm_calls: 0
  atomic_finalization: true
  full_result_overwrite: false
